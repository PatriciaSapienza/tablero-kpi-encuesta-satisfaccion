<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de satisfacción</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --fondo:#ffffff; --tarjeta:#ffffff; --texto:#1f2937; --muted:#5b6472; --borde:#d1d5db;
    --acento:#1e3a5f;
    --verde:#166534; --verde-bg:#e8f3ec;
    --amarillo:#854d0e; --amarillo-bg:#fbf3dc;
    --rojo:#991b1b; --rojo-bg:#fbe9e7;
    --neutro-txt:#4b5563; --neutro-bg:#f0f1f3;
  }
  
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--fondo);color:var(--texto);font-size:14px;overflow-x:hidden}
  header{background:var(--tarjeta);border-bottom:1px solid var(--borde);padding:16px 24px}
  header h1{margin:0;font-size:18px;font-weight:600;color:var(--acento)}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px}
  main{padding:20px 24px;max-width:1200px;margin:auto;min-width:0}
  h2{font-size:15px;font-weight:600;margin:28px 0 10px;color:var(--acento)}
  .filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:12px 14px}
  .filtros label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
  .fechas{border:0;padding:0;margin:0;display:flex;gap:12px;flex-wrap:wrap;min-width:0}
  .fechas legend{font-size:12px;color:var(--muted);padding:0;margin-bottom:4px}
  .fechas label{flex:1 1 130px}
  input,select,button{font:inherit;padding:8px 9px;border-radius:6px;border:1px solid #9ca3af;background:#fff;color:var(--texto);max-width:100%}
  input,select{font-size:16px}
  button{background:var(--acento);color:#fff;border:0;cursor:pointer}
  button:hover{opacity:.9}
  .estado-txt{color:var(--rojo);font-size:12px;align-self:center}
  .tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--borde)}
  .tab{background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 16px;font-weight:600}
  .tab.activo{color:var(--acento);border-bottom-color:var(--acento)}
  .tab:hover{opacity:1}
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:14px 16px;position:relative;min-width:0}
  .card h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
  .valor{font-size:28px;font-weight:600;line-height:1.1;color:var(--texto)}
  .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:middle}
  .verde{background:var(--verde-bg);color:var(--verde)}
  .amarillo{background:var(--amarillo-bg);color:var(--amarillo)}
  .rojo{background:var(--rojo-bg);color:var(--rojo)}
  .neutro{background:var(--neutro-bg);color:var(--neutro-txt)}
  .tabla-wrap{width:100%;max-width:100%;overflow-x:auto;border:1px solid var(--borde);border-radius:10px;background:var(--tarjeta)}
  table{width:100%;border-collapse:collapse;background:var(--tarjeta)}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--borde);font-size:13px}
  th{background:#eef1f5;color:#374151;font-weight:600;font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .prioridad{background:var(--tarjeta);border:1px solid var(--borde);border-left:4px solid var(--acento);border-radius:10px;padding:12px 16px;margin-bottom:12px}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
  .charts .card{height:320px}
  .card.ancho{height:340px}
  canvas{max-width:100%}
  .nota{font-size:12px;color:var(--muted);margin:8px 0 0}
  details.card summary{cursor:pointer;font-weight:600;color:var(--acento);list-style-position:inside}
  .lista-comentarios{max-height:420px;overflow-y:auto;margin-top:12px;padding-right:6px}
  .comentario{border-bottom:1px solid var(--borde);padding:10px 0}
  .comentario:last-child{border-bottom:0}
